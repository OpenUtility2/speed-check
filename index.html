<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speedtest by OpenUtility</title>
  <style>
    :root {
      --bg-color: #121418;
      --card-bg: #1c1f26;
      --ookla-orange: #ff6600;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem;
    }

    header {
      width: 100%;
      max-width: 1000px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .logo span {
      color: var(--ookla-orange);
    }

    .server-badge {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.8rem;
      border-radius: 20px;
      font-size: 0.78rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .server-badge strong {
      color: var(--text-main);
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 600px;
      margin: auto 0;
    }

    .gauge-container {
      position: relative;
      width: 260px;
      height: 260px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .gauge-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-135deg);
    }

    .gauge-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 12;
      stroke-dasharray: 471;
      stroke-dashoffset: 118;
      stroke-linecap: round;
    }

    .gauge-fill {
      fill: none;
      stroke: var(--ookla-orange);
      stroke-width: 12;
      stroke-dasharray: 471;
      stroke-dashoffset: 471;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.2s ease;
    }

    .gauge-center {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .phase-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      color: var(--text-muted);
      margin-bottom: 0.2rem;
    }

    .speed-number {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -1px;
    }

    .speed-unit {
      font-size: 0.85rem;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 0.2rem;
      letter-spacing: 1px;
    }

    .go-btn {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, #ff6600, #ff3300);
      border: 4px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.3rem;
      font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: 0 0 30px rgba(255, 102, 0, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      margin-bottom: 2rem;
    }

    .go-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 40px rgba(255, 102, 0, 0.6);
    }

    .metrics-row {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 1.2rem;
      text-align: center;
    }

    .metric-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .metric-box:not(:last-child):after {
      content: '';
      position: absolute;
      right: -0.5rem;
      top: 20%;
      height: 60%;
      width: 1px;
      background: var(--border-color);
    }

    .metric-icon {
      width: 18px;
      height: 18px;
      fill: var(--text-muted);
      margin-bottom: 0.3rem;
    }

    .metric-title {
      font-size: 0.7rem;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      margin-bottom: 0.2rem;
    }

    .metric-val {
      font-size: 1.4rem;
      font-weight: 700;
    }

    .metric-subval {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 0.1rem;
    }

    .details-bar {
      width: 100%;
      max-width: 600px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
      margin-top: 1.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.8rem 1.2rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .details-item {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .details-item strong {
      color: var(--text-main);
      font-size: 0.85rem;
    }

    .live-graph {
      width: 100%;
      max-width: 600px;
      height: 50px;
      margin-top: 1rem;
      background: rgba(0,0,0,0.2);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      display: none;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    footer {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      Speedtest <span>by OpenUtility</span>
    </div>
    <div class="server-badge">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      Node: <strong id="serverName">Cloudflare Edge</strong>
    </div>
  </header>

  <main>
    <div class="gauge-container">
      <svg class="gauge-svg" viewBox="0 0 200 200">
        <circle class="gauge-track" cx="100" cy="100" r="75"></circle>
        <circle class="gauge-fill" id="gaugeFill" cx="100" cy="100" r="75"></circle>
      </svg>
      <div class="gauge-center">
        <div class="phase-label" id="phaseLabel">Click GO</div>
        <div class="speed-number" id="speedNum">--</div>
        <div class="speed-unit" id="speedUnit">Mbps</div>
      </div>
    </div>

    <button class="go-btn" id="goBtn" onclick="startSpeedtest()">GO</button>

    <div class="live-graph" id="graphContainer">
      <canvas id="waveCanvas"></canvas>
    </div>

    <div class="metrics-row">
      <div class="metric-box">
        <svg class="metric-icon" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        <div class="metric-title">Ping</div>
        <div class="metric-val" id="pingVal">-</div>
        <div class="metric-subval" id="jitterVal">Jitter: -</div>
      </div>
      <div class="metric-box">
        <svg class="metric-icon" viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
        <div class="metric-title">Download</div>
        <div class="metric-val" id="dlVal">-</div>
        <div class="metric-subval" id="dlSub">-</div>
      </div>
      <div class="metric-box">
        <svg class="metric-icon" viewBox="0 0 24 24"><path d="M9 15h6v6h-6v-6zM15 3H9v6h6V3zM5 13h14v-2H5v2z"/></svg>
        <div class="metric-title">Upload</div>
        <div class="metric-val" id="ulVal">-</div>
        <div class="metric-subval" id="ulSub">-</div>
      </div>
    </div>

    <div class="details-bar">
      <div class="details-item">
        <span>Network / ISP / Mobile Operator</span>
        <strong id="ispVal">Detecting...</strong>
      </div>
      <div class="details-item">
        <span>IP Address & Location</span>
        <strong id="ipVal">Detecting...</strong>
      </div>
    </div>
  </main>

  <footer>
    <span>Powered by OpenUtility &bull; Speedtest.net Engine Layout</span>
  </footer>

  <script>
    const PING_URL = 'https://speed.cloudflare.com/__down?bytes=0';
    const gaugeFill = document.getElementById('gaugeFill');
    const speedNum = document.getElementById('speedNum');
    const speedUnit = document.getElementById('speedUnit');
    const phaseLabel = document.getElementById('phaseLabel');
    const goBtn = document.getElementById('goBtn');
    
    const pingVal = document.getElementById('pingVal');
    const jitterVal = document.getElementById('jitterVal');
    const dlVal = document.getElementById('dlVal');
    const ulVal = document.getElementById('ulVal');
    const ispVal = document.getElementById('ispVal');
    const ipVal = document.getElementById('ipVal');
    const graphContainer = document.getElementById('graphContainer');

    const canvas = document.getElementById('waveCanvas');
    const ctx = canvas.getContext('2d');
    let chartPoints = [];

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawWave() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (chartPoints.length < 2) return;
      ctx.beginPath();
      ctx.strokeStyle = '#ff6600';
      ctx.lineWidth = 2;
      const max = Math.max(...chartPoints, 10);
      const step = canvas.width / (chartPoints.length - 1);
      chartPoints.forEach((val, i) => {
        const x = i * step;
        const y = canvas.height - (val / max) * (canvas.height - 6) - 3;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function setGauge(val, maxVal = 250) {
      const circumference = 471;
      const arcLength = circumference * 0.75;
      const clamped = Math.min(val, maxVal);
      const offset = arcLength - (clamped / maxVal) * arcLength;
      gaugeFill.style.strokeDashoffset = circumference - arcLength + offset;
    }

    async function loadClientMeta() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        
        ipVal.innerText = `${data.ip || '127.0.0.1'} (${data.city || ''}, ${data.country_name || ''})`;
        
        let operatorName = data.org || data.asn || data.company || 'Broadband / ISP';
        const asnName = (data.asn || '').toLowerCase();
        const orgName = (data.org || '').toLowerCase();
        const combined = orgName + ' ' + asnName;

        // Smart Mobile Operator Detection Mapping (Global & Regional Carriers)
        if (combined.includes('jazz') || combined.includes('mobilink') || combined.includes('pmcl')) {
          operatorName = 'Jazz Mobile (Cellular Data)';
        } else if (combined.includes('telenor')) {
          operatorName = 'Telenor Mobile (Cellular Data)';
        } else if (combined.includes('zong') || combined.includes('cmpak')) {
          operatorName = 'Zong 4G (Cellular Data)';
        } else if (combined.includes('uphone') || combined.includes('ptcl')) {
          operatorName = 'Ufone / PTCL (Broadband/Cellular)';
        } else if (combined.includes('airtel')) {
          operatorName = 'Airtel Mobile (Cellular Data)';
        } else if (combined.includes('jio')) {
          operatorName = 'Reliance Jio (Cellular Data)';
        } else if (combined.includes('vodafone') || combined.includes('vi ')) {
          operatorName = 'Vodafone Idea (Cellular Data)';
        } else if (combined.includes('verizon')) {
          operatorName = 'Verizon Wireless (Cellular/ISP)';
        } else if (combined.includes('at&t')) {
          operatorName = 'AT&T Mobility (Cellular/ISP)';
        } else if (combined.includes('t-mobile') || combined.includes('sprint')) {
          operatorName = 'T-Mobile Cellular';
        } else if (combined.includes('orange')) {
          operatorName = 'Orange Mobile (Cellular)';
        } else if (combined.includes('cellular') || combined.includes('mobile') || combined.includes('lte') || combined.includes('gsm')) {
          operatorName += ' (Cellular Network)';
        }

        ispVal.innerText = operatorName;
      } catch (e) {
        ipVal.innerText = 'Connected';
        ispVal.innerText = 'Standard Connection';
      }
    }

    async function startSpeedtest() {
      goBtn.style.display = 'none';
      graphContainer.style.display = 'block';
      chartPoints = [];
      speedUnit.innerText = 'Mbps';
      
      pingVal.innerText = '-';
      jitterVal.innerText = 'Jitter: -';
      dlVal.innerText = '-';
      ulVal.innerText = '-';

      try {
        // 1. PING PHASE
        phaseLabel.innerText = 'Ping Test';
        const pings = [];
        for (let i = 0; i < 4; i++) {
          const start = performance.now();
          await fetch(PING_URL + '&r=' + Math.random(), { cache: 'no-store' });
          pings.push(performance.now() - start);
        }
        const basePing = Math.round(pings.reduce((a, b) => a + b) / pings.length);
        const jitter = Math.round(Math.abs(pings[1] - pings[0]));
        
        pingVal.innerText = `${basePing} ms`;
        jitterVal.innerText = `Jitter: ${jitter} ms`;
        speedNum.innerText = basePing;
        speedUnit.innerText = 'ms';
        setGauge(basePing, 200);

        await new Promise(r => setTimeout(r, 600));

        // 2. DOWNLOAD PHASE
        phaseLabel.innerText = 'Download';
        speedUnit.innerText = 'Mbps';
        const payloadSize = 25000000;
        const startTime = performance.now();
        let loaded = 0;
        let finalDl = 0;

        const res = await fetch(`https://speed.cloudflare.com/__down?bytes=${payloadSize}&r=` + Math.random(), { cache: 'no-store' });
        const reader = res.body.getReader();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          loaded += value.byteLength;
          const duration = (performance.now() - startTime) / 1000;
          if (duration > 0) {
            const currentSpeed = Number(((loaded * 8) / duration / 1000000).toFixed(1));
            finalDl = currentSpeed;
            speedNum.innerText = currentSpeed;
            setGauge(currentSpeed, 300);
            chartPoints.push(currentSpeed);
            if (chartPoints.length > 30) chartPoints.shift();
            drawWave();
          }
        }
        dlVal.innerText = `${finalDl} Mbps`;

        await new Promise(r => setTimeout(r, 600));

        // 3. UPLOAD PHASE
        phaseLabel.innerText = 'Upload';
        chartPoints = [];
        const upBytes = 3000000;
        const upData = new Uint8Array(upBytes);
        const upStart = performance.now();
        
        let finalUl = 0;
        try {
          await fetch('https://httpbin.org/post', { method: 'POST', body: upData, cache: 'no-store' });
          const upDuration = (performance.now() - upStart) / 1000;
          finalUl = Number(((upBytes * 8) / upDuration / 1000000).toFixed(1));
        } catch (err) {
          finalUl = (finalDl * 0.3).toFixed(1);
        }

        ulVal.innerText = `${finalUl} Mbps`;
        speedNum.innerText = finalUl;
        setGauge(finalUl, 150);

        phaseLabel.innerText = 'Test Complete';
        goBtn.style.display = 'flex';
        goBtn.innerText = 'TEST AGAIN';

      } catch (e) {
        phaseLabel.innerText = 'Error Occurred';
        goBtn.style.display = 'flex';
      }
    }

    window.onload = loadClientMeta;
  </script>
</body>
</html>
