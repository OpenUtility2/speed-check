<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Speed Check - Powered by OpenUtility</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(22, 28, 45, 0.75);
      --primary-blue: #00a8ff;
      --primary-green: #7bed9f;
      --accent-glow: rgba(0, 168, 255, 0.25);
      --text-main: #ffffff;
      --text-muted: #8a99ad;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 50% 20%, rgba(0, 168, 255, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 80% 80%, rgba(123, 237, 159, 0.08) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1rem;
      overflow-x: hidden;
    }

    header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: 900;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, var(--primary-blue), var(--primary-green));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .header-controls {
      display: flex;
      gap: 0.75rem;
      align-items: center;
    }

    .badge {
      background: rgba(0, 168, 255, 0.1);
      border: 1px solid rgba(0, 168, 255, 0.2);
      color: var(--primary-blue);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .select-payload {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 0.35rem 0.75rem;
      border-radius: 12px;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 540px;
      margin: auto 0;
    }

    /* Network Info Pill */
    .network-pill {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      padding: 0.5rem 1rem;
      border-radius: 30px;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.5rem;
      width: 100%;
      justify-content: space-between;
    }

    .network-pill span {
      color: var(--text-main);
      font-weight: 600;
    }

    /* Gauge */
    .gauge-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .gauge-svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .gauge-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 8;
    }

    .gauge-progress {
      fill: none;
      stroke: url(#gradient);
      stroke-width: 8;
      stroke-linecap: round;
      stroke-dasharray: 659;
      stroke-dashoffset: 659;
      filter: drop-shadow(0px 0px 8px var(--primary-blue));
    }

    .speed-content {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .speed-value {
      font-size: 4.2rem;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -2px;
      background: linear-gradient(180deg, #ffffff 40%, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .speed-unit {
      font-size: 1rem;
      font-weight: 600;
      margin-top: 0.2rem;
      color: var(--primary-blue);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .status {
      margin-top: 1.2rem;
      font-size: 0.9rem;
      font-weight: 500;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      height: 20px;
    }

    /* Real-Time Graph Canvas */
    .chart-container {
      width: 100%;
      height: 70px;
      margin-top: 1rem;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      border: 1px solid var(--border-color);
      overflow: hidden;
      position: relative;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* Action Buttons */
    .btn-group {
      display: flex;
      gap: 0.75rem;
      margin-top: 1.2rem;
    }

    .action-btn {
      background: linear-gradient(135deg, var(--primary-blue), #0072ff);
      border: none;
      color: #fff;
      border-radius: 25px;
      padding: 0.7rem 1.6rem;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      box-shadow: 0 8px 20px var(--accent-glow);
      transition: all 0.3s ease;
    }

    .action-btn.secondary {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      box-shadow: none;
      color: var(--text-main);
    }

    .action-btn:hover {
      transform: translateY(-2px);
    }

    .action-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    /* Metrics Cards Grid */
    .metrics-card {
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.2rem;
      margin-top: 1.2rem;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 0.5rem;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .metric-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .metric-label {
      font-size: 0.65rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 0.3rem;
    }

    .metric-value {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* History Drawer Panel */
    .history-section {
      width: 100%;
      max-width: 540px;
      margin-top: 1.2rem;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1rem 1.2rem;
    }

    .history-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-bottom: 0.5rem;
    }

    .history-list {
      max-height: 100px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.02);
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
    }

    .history-item strong {
      color: var(--text-main);
    }

    /* Footer */
    footer {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 1.5rem;
    }

    .brand-container {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      color: var(--text-main);
      font-weight: 600;
    }

    .openutility-logo {
      width: 20px;
      height: 20px;
      vertical-align: middle;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <span>FAST</span><span style="color: #fff; font-weight: 300;">SPEED</span>
    </div>
    <div class="header-controls">
      <select class="select-payload" id="payloadSize" title="Select Test Size">
        <option value="10000000">10 MB (Quick)</option>
        <option value="25000000" selected>25 MB (Standard)</option>
        <option value="50000000">50 MB (Heavy)</option>
      </select>
      <div class="badge">Pro Engine</div>
    </div>
  </header>

  <main>
    <div class="network-pill" id="networkPill">
      <div>IP: <span id="ipAddr">Detecting...</span></div>
      <div>ISP: <span id="ispName">Detecting...</span></div>
    </div>

    <div class="gauge-wrapper">
      <svg class="gauge-svg" viewBox="0 0 240 240">
        <defs>
          <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00a8ff" />
            <stop offset="100%" stop-color="#7bed9f" />
          </linearGradient>
        </defs>
        <circle class="gauge-bg" cx="120" cy="120" r="105" />
        <circle class="gauge-progress" id="progressRing" cx="120" cy="120" r="105" />
      </svg>

      <div class="speed-content">
        <span class="speed-value" id="speed">0</span>
        <span class="speed-unit" id="unit">Mbps</span>
      </div>
    </div>

    <div class="status" id="status">Initializing...</div>

    <div class="chart-container">
      <canvas id="speedChart"></canvas>
    </div>

    <div class="btn-group">
      <button class="action-btn" id="restartBtn" style="display: none;" onclick="startTest()">
        <svg viewBox="0 0 24 24"><path d="M17.65 6.35A7.958 7.958 0 0012 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0112 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
        Re-test
      </button>
      <button class="action-btn secondary" id="shareBtn" style="display: none;" onclick="shareResults()">
        <svg viewBox="0 0 24 24"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92 1.61 0 2.92-1.31 2.92-2.92s-1.31-2.92-2.92-2.92z"/></svg>
        Share
      </button>
    </div>

    <div class="metrics-card">
      <div class="metric-item">
        <span class="metric-label">Latency</span>
        <span class="metric-value" id="latency">-</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Jitter</span>
        <span class="metric-value" id="jitter">-</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Download</span>
        <span class="metric-value" id="downloadVal">-</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Upload</span>
        <span class="metric-value" id="uploadVal">-</span>
      </div>
      <div class="metric-item">
        <span class="metric-label">Bloat</span>
        <span class="metric-value" id="bloatVal">-</span>
      </div>
    </div>

    <div class="history-section" id="historySection" style="display: none;">
      <div class="history-header">
        <span>Recent Results</span>
        <span style="cursor: pointer; font-size: 0.7rem; color: var(--primary-blue);" onclick="clearHistory()">Clear</span>
      </div>
      <div class="history-list" id="historyList"></div>
    </div>
  </main>

  <footer>
    <span>Powered by</span>
    <div class="brand-container">
      <svg class="openutility-logo" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M 86.8 200 C 86.8 137.4 137.4 86.8 200 86.8 C 262.5 86.8 313.1 137.4 313.1 200 C 313.1 262.5 262.5 313.1 200 313.1 L 200 352.8 C 284.4 352.8 352.8 284.4 352.8 200 C 352.8 115.5 284.4 47.1 200 47.1 C 115.5 47.1 47.1 115.5 47.1 200 L 86.8 200 Z" fill="#00a8ff"/>
        <path d="M 173.3 173.3 C 158.6 188 158.6 211.9 173.3 226.6 C 188 241.3 211.9 241.3 226.6 226.6 L 277.6 226.6 C 262.9 270.8 221 302 171.9 302 C 112.5 302 64.3 253.8 64.3 194.4 C 64.3 145.3 95.5 103.4 139.7 88.7 L 173.3 173.3 Z" fill="#7bed9f"/>
      </svg>
      <span>OpenUtility</span>
    </div>
  </footer>

  <script>
    const PING_URL = 'https://speed.cloudflare.com/__down?bytes=0';
    
    const speedEl = document.getElementById('speed');
    const statusEl = document.getElementById('status');
    const restartBtn = document.getElementById('restartBtn');
    const shareBtn = document.getElementById('shareBtn');
    const latencyEl = document.getElementById('latency');
    const jitterEl = document.getElementById('jitter');
    const downloadValEl = document.getElementById('downloadVal');
    const uploadValEl = document.getElementById('uploadVal');
    const bloatValEl = document.getElementById('bloatVal');
    const progressRing = document.getElementById('progressRing');
    const ipAddrEl = document.getElementById('ipAddr');
    const ispNameEl = document.getElementById('ispName');
    
    const CIRCUMFERENCE = 2 * Math.PI * 105;
    let currentMaxSpeed = 100;
    let chartDataPoints = [];

    // Canvas Setup for Real-time Chart
    const canvas = document.getElementById('speedChart');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawChart() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (chartDataPoints.length < 2) return;

      ctx.beginPath();
      ctx.strokeStyle = '#00a8ff';
      ctx.lineWidth = 2;

      const maxVal = Math.max(...chartDataPoints, 10);
      const stepX = canvas.width / (chartDataPoints.length - 1);

      chartDataPoints.forEach((val, index) => {
        const x = index * stepX;
        const y = canvas.height - (val / maxVal) * (canvas.height - 10) - 5;
        if (index === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      });
      ctx.stroke();
    }

    function setGaugeProgress(speedMbps) {
      if (speedMbps > currentMaxSpeed) {
        if (speedMbps <= 500) currentMaxSpeed = 500;
        else currentMaxSpeed = 1000;
      }
      const progress = Math.min(speedMbps / currentMaxSpeed, 1);
      const offset = CIRCUMFERENCE - (progress * CIRCUMFERENCE);
      progressRing.style.strokeDashoffset = offset;
    }

    // Fetch IP Geolocation Info
    async function fetchNetworkInfo() {
      try {
        const res = await fetch('https://ipapi.co/json/');
        const data = await res.json();
        ipAddrEl.innerText = data.ip || 'Unknown';
        ispNameEl.innerText = data.org || data.country_name || 'Broadband';
      } catch (e) {
        ipAddrEl.innerText = 'Unavailable';
        ispNameEl.innerText = 'Local Network';
      }
    }

    // Advanced Latency & Jitter Measurement
    async function measureLatencyAndJitter() {
      const pings = [];
      for (let i = 0; i < 4; i++) {
        const start = performance.now();
        await fetch(PING_URL + '&r=' + Math.random(), { cache: 'no-store' });
        pings.push(performance.now() - start);
      }
      const basePing = Math.round(pings.reduce((a, b) => a + b) / pings.length);
      
      // Calculate jitter (mean absolute deviation)
      const deviations = pings.map(p => Math.abs(p - basePing));
      const jitter = Math.round(deviations.reduce((a, b) => a + b) / deviations.length);
      
      return { basePing, jitter };
    }

    // Upload Test Routine
    async function measureUpload() {
      const bytes = 2000000; // 2MB Upload Payload
      const data = new Uint8Array(bytes);
      const start = performance.now();
      
      try {
        const response = await fetch('https://httpbin.org/post', {
          method: 'POST',
          body: data,
          cache: 'no-store'
        });
        if (!response.ok) throw new Error();
        const duration = (performance.now() - start) / 1000;
        return ((bytes * 8) / duration / 1000000).toFixed(1);
      } catch (e) {
        return null;
      }
    }

    async function startTest() {
      speedEl.innerText = '0';
      currentMaxSpeed = 100;
      setGaugeProgress(0);
      chartDataPoints = [];
      drawChart();
      
      statusEl.innerText = 'Analyzing Latency & Jitter...';
      restartBtn.style.display = 'none';
      shareBtn.style.display = 'none';
      latencyEl.innerText = '-';
      jitterEl.innerText = '-';
      downloadValEl.innerText = '-';
      uploadValEl.innerText = '-';
      bloatValEl.innerText = '-';

      try {
        // 1. Latency & Jitter Phase
        const { basePing, jitter } = await measureLatencyAndJitter();
        latencyEl.innerText = `${basePing} ms`;
        jitterEl.innerText = `${jitter} ms`;

        // 2. Download Speed Test Phase
        statusEl.innerText = 'Testing Download Throughput...';
        const payloadSize = Number(document.getElementById('payloadSize').value);
        const TEST_FILE_URL = `https://speed.cloudflare.com/__down?bytes=${payloadSize}`;
        
        const startTime = performance.now();
        let loadedBytes = 0;

        const response = await fetch(TEST_FILE_URL + '&r=' + Math.random(), { cache: 'no-store' });
        if (!response.ok) throw new Error('Download failure');
        const reader = response.body.getReader();

        let finalDownloadSpeed = 0;

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          loadedBytes += value.byteLength;
          const currentTime = performance.now();
          const durationSeconds = (currentTime - startTime) / 1000;

          if (durationSeconds > 0) {
            const currentSpeed = Number(((loadedBytes * 8) / durationSeconds / 1000000).toFixed(1));
            finalDownloadSpeed = currentSpeed;
            
            speedEl.innerText = currentSpeed;
            setGaugeProgress(currentSpeed);

            chartDataPoints.push(currentSpeed);
            if (chartDataPoints.length > 25) chartDataPoints.shift();
            drawChart();
          }
        }

        downloadValEl.innerText = `${finalDownloadSpeed} Mbps`;

        // Measure Latency Under Load (Bufferbloat check)
        const loadStart = performance.now();
        await fetch(PING_URL + '&r=' + Math.random(), { cache: 'no-store' });
        const loadedPing = Math.round(performance.now() - loadStart);
        const bufferbloat = Math.max(0, loadedPing - basePing);
        bloatValEl.innerText = `+${bufferbloat} ms`;

        // 3. Upload Speed Test Phase
        statusEl.innerText = 'Testing Upload Throughput...';
        const uploadSpeed = await measureUpload();
        if (uploadSpeed !== null) {
          uploadValEl.innerText = `${uploadSpeed} Mbps`;
        } else {
          uploadValEl.innerText = 'N/A';
        }

        // Completion
        statusEl.innerText = 'Test Completed Successfully';
        restartBtn.style.display = 'flex';
        shareBtn.style.display = 'flex';

        saveToHistory({
          time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
          ping: basePing,
          download: finalDownloadSpeed,
          upload: uploadSpeed || '0'
        });

      } catch (error) {
        statusEl.innerText = 'Test Interrupted (Network Error)';
        console.error(error);
        restartBtn.style.display = 'flex';
      }
    }

    // LocalStorage History Management
    function saveToHistory(result) {
      let history = JSON.parse(localStorage.getItem('openutility_speed_history') || '[]');
      history.unshift(result);
      if (history.length > 5) history.pop();
      localStorage.setItem('openutility_speed_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      const history = JSON.parse(localStorage.getItem('openutility_speed_history') || '[]');
      const section = document.getElementById('historySection');
      const list = document.getElementById('historyList');

      if (history.length === 0) {
        section.style.display = 'none';
        return;
      }

      section.style.display = 'block';
      list.innerHTML = history.map(h => `
        <div class="history-item">
          <span>${h.time}</span>
          <span>Ping: <strong>${h.ping}ms</strong></span>
          <span>DL: <strong>${h.download} Mbps</strong></span>
          <span>UL: <strong>${h.upload} Mbps</strong></span>
        </div>
      `).join('');
    }

    function clearHistory() {
      localStorage.removeItem('openutility_speed_history');
      renderHistory();
    }

    function shareResults() {
      const text = `FastSpeed Results — Download: ${downloadValEl.innerText}, Upload: ${uploadValEl.innerText}, Latency: ${latencyEl.innerText}. Powered by OpenUtility.`;
      navigator.clipboard.writeText(text).then(() => {
        const originalText = shareBtn.innerHTML;
        shareBtn.innerHTML = 'Copied!';
        setTimeout(() => shareBtn.innerHTML = originalText, 2000);
      });
    }

    window.onload = () => {
      fetchNetworkInfo();
      renderHistory();
      startTest();
    };
  </script>
</body>
</html>
